# Alembic configuration.
#
# The database URL is intentionally left blank here: env.py reads it from the
# application Settings (CONDUIT_DATABASE_URL) so there is one source of truth.
# Tests override it via `config.set_main_option("sqlalchemy.url", ...)`.

[alembic]
script_location = src/conduit/infra/db/alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
