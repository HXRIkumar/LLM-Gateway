[project]
name = "conduit"
version = "0.0.0"
description = "Open-source AI Gateway: an OpenAI-compatible control plane for LLM traffic."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [{ name = "Conduit maintainers" }]
keywords = ["ai", "gateway", "llm", "openai", "proxy", "infrastructure"]

# MVP (Phase 1) runtime dependencies only. Later phases add their own deps via
# `uv add` when the phase begins (see docs/ROADMAP.md):
#   V2: arq (workers)                     — background jobs, health probes, roll-ups
#   V4: opentelemetry-sdk + exporters,    — tracing
#       prometheus-client                 — metrics
#   V5: an embeddings/vector lib          — semantic cache
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "structlog>=24.1",
    "orjson>=3.10",
]

[project.scripts]
conduit = "conduit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.5",
    "coverage[toml]>=7.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "openai>=1.30",            # used only in compatibility tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conduit"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Reasonable, strict-ish default set. Expand deliberately, not reflexively.
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "ASYNC",         # async correctness (no blocking calls on the request path)
    "RUF",
]
ignore = ["E501"]    # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib mode: unique module names per path, so same-basename test files in
# different directories (e.g. unit vs integration) don't collide.
addopts = "-ra -q --import-mode=importlib"
markers = [
    "integration: tests that require Postgres/Redis via testcontainers",
    "compat: OpenAI-SDK compatibility tests",
]

[tool.coverage.run]
branch = true
source = ["src/conduit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
